services:
  # ----------------------------------------------------------------------------
  # 1. Python Flask AI Microservice (Sentence-BERT Scorer)
  # ----------------------------------------------------------------------------
  - type: web
    name: portal-hr-flask-ai
    env: python
    rootDir: backend/ml
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 scorer_service:app
    envVars:
      - key: PORT
        value: 10000
      - key: MODEL_NAME
        value: paraphrase-multilingual-MiniLM-L12-v2
      - key: ALLOWED_ORIGINS
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. Node.js Express Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: portal-hr-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SCORER_URL
        fromService:
          type: web
          name: portal-hr-flask-ai
          property: host
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_PORT
        value: 993
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: IMAP_TLS
        value: "true"
      - key: EMAIL_POLL_INTERVAL
        value: "5"
